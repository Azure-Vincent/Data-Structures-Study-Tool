name: Build desktop apps

# Builds DS Study Lab for Windows, macOS and Linux and proves each build works:
# every platform job runs the unit tests and the cross-language check (the C++
# and Python programs compiled and run with that platform's own compiler and
# Python), builds the installers, installs them
# the way a user would, launches the installed app and drives its core
# features (tests/desktop/smoke.mjs), then uninstalls.
#  - Every push / pull request: all of the above; the files are downloadable
#    from the run's "Artifacts" section.
#  - Pushing a tag like v1.0.3: also publishes a GitHub Release with every file.
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test
      # the C++ and Python versions of every program must print what the pseudocode prints
      - name: Compare the C++, Python and pseudocode programs
        run: node tests/langs/verify.mjs

  windows:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # the C++ and Python versions of every program must print what the pseudocode prints
      - name: Compare the C++, Python and pseudocode programs
        run: node tests/langs/verify.mjs
      # The app compares its own version with the latest release, so a tagged
      # build must carry the tag's version (v1.2.0 -> 1.2.0).
      - name: Use the tag as the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: Build portable .exe and installer
        run: npx electron-builder --win portable nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Install with the setup .exe (silent, per user)
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\*-setup.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs", "$env:ProgramFiles" -Recurse -Filter 'DS Study Lab.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw 'DS Study Lab.exe was not installed' }
          Write-Host "Installed to $($exe.FullName)"
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\DS Study Lab.lnk")) { throw 'no Start menu shortcut' }
          $reg = Get-ChildItem HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall | Get-ItemProperty | Where-Object DisplayName -like 'DS Study Lab*'
          if (-not $reg) { throw 'no entry in Apps & features' }
          "DSLAB_EXE=$($exe.FullName)" | Out-File -Append $env:GITHUB_ENV
      - name: Launch the installed app and test core features
        run: node tests/desktop/smoke.mjs --exe "$env:DSLAB_EXE" --mode installed --label windows-installed --out smoke-out
      - name: Launch the portable .exe and test core features
        shell: pwsh
        run: |
          $portable = (Get-ChildItem dist\*-portable.exe | Select-Object -First 1).FullName
          node tests/desktop/smoke.mjs --exe "$portable" --mode portable --cdp --label windows-portable --out smoke-out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Uninstall (silent) and check nothing is left behind
        shell: pwsh
        run: |
          $dir = Split-Path $env:DSLAB_EXE
          Start-Process -FilePath (Join-Path $dir 'Uninstall DS Study Lab.exe') -ArgumentList '/S' -Wait
          # the uninstaller re-launches itself from %TEMP%, so -Wait returns early: poll
          $lnk = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\DS Study Lab.lnk"
          for ($i = 0; $i -lt 60 -and ((Test-Path $env:DSLAB_EXE) -or (Test-Path $lnk)); $i++) { Start-Sleep 1 }
          if (Test-Path $env:DSLAB_EXE) { throw 'the app is still installed' }
          if (Test-Path $lnk) { throw 'Start menu shortcut left behind' }
          $reg = Get-ChildItem HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall | Get-ItemProperty | Where-Object DisplayName -like 'DS Study Lab*'
          if ($reg) { throw 'still listed in Apps & features' }
          Write-Host 'Uninstalled cleanly'
      - uses: actions/upload-artifact@v4
        with:
          name: DS-Study-Lab-windows
          # latest.yml + .blockmap let installed copies find and download updates
          path: |
            dist/*-portable.exe
            dist/*-setup.exe
            dist/*-setup.exe.blockmap
            dist/latest.yml
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-windows
          path: smoke-out

  macos:
    needs: test
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # the C++ and Python versions of every program must print what the pseudocode prints
      - name: Compare the C++, Python and pseudocode programs
        run: node tests/langs/verify.mjs
      - name: Use the tag as the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: 'Build the .dmg (universal: Apple Silicon + Intel, ad-hoc signed)'
        run: npx electron-builder --mac dmg --universal --publish never
        env:
          # electron-builder skips all signing on pull-request builds by default;
          # ad-hoc signing uses no secrets, so keep PR builds identical to releases
          CSC_FOR_PULL_REQUEST: 'true'
      - name: Install from the .dmg
        run: |
          DMG=$(ls dist/*.dmg | head -1)
          hdiutil attach "$DMG" -nobrowse -mountpoint /tmp/dslab-dmg
          test -L /tmp/dslab-dmg/Applications || { echo 'no Applications shortcut in the dmg'; exit 1; }
          mkdir -p "$HOME/Applications"
          ditto "/tmp/dslab-dmg/DS Study Lab.app" "$HOME/Applications/DS Study Lab.app"
          hdiutil detach /tmp/dslab-dmg
          APP="$HOME/Applications/DS Study Lab.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -E 'Signature|Identifier'
          lipo -archs "$APP/Contents/MacOS/DS Study Lab" | tee /tmp/archs
          grep -q x86_64 /tmp/archs && grep -q arm64 /tmp/archs
          echo "DSLAB_APP=$APP" >> "$GITHUB_ENV"
      - name: Launch the installed app (Apple Silicon) and test core features
        run: node tests/desktop/smoke.mjs --exe "$DSLAB_APP/Contents/MacOS/DS Study Lab" --mode mac --label macos-arm64 --out smoke-out
      - name: Launch the Intel part of the app through Rosetta and test core features
        run: |
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            sudo softwareupdate --install-rosetta --agree-to-license || { echo "::warning::Rosetta is not available on this runner; the Intel build was not launched"; exit 0; }
          fi
          printf '#!/bin/sh\nexec arch -x86_64 "%s/Contents/MacOS/DS Study Lab" "$@"\n' "$DSLAB_APP" > /tmp/dslab-x64
          chmod +x /tmp/dslab-x64
          node tests/desktop/smoke.mjs --exe /tmp/dslab-x64 --mode mac --label macos-x64-rosetta --out smoke-out
      - uses: actions/upload-artifact@v4
        with:
          name: DS-Study-Lab-macos
          path: dist/*.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-macos
          path: smoke-out

  linux:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # the C++ and Python versions of every program must print what the pseudocode prints
      - name: Compare the C++, Python and pseudocode programs
        run: node tests/langs/verify.mjs
      - name: Use the tag as the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: Build the AppImage and .deb
        run: npx electron-builder --linux AppImage deb --x64 --publish never
      - name: Install the .deb with apt
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb libfuse2t64 ./dist/*.deb
          test -x "/opt/DS Study Lab/ds-study-lab"
          test -e /usr/bin/ds-study-lab
          grep -q '^Exec=' /usr/share/applications/ds-study-lab.desktop
      - name: Launch the installed .deb app and test core features
        run: xvfb-run -a node tests/desktop/smoke.mjs --exe /usr/bin/ds-study-lab --mode package --label linux-deb --out smoke-out
      - name: Launch the AppImage and test core features
        run: |
          chmod +x dist/*.AppImage
          xvfb-run -a node tests/desktop/smoke.mjs --exe "$(ls dist/*.AppImage | head -1)" --mode appimage --label linux-appimage --out smoke-out
      - name: Uninstall the .deb and check nothing is left behind
        run: |
          sudo apt-get remove -y -q ds-study-lab
          test ! -e "/opt/DS Study Lab" && test ! -e /usr/bin/ds-study-lab && echo 'Uninstalled cleanly'
      - uses: actions/upload-artifact@v4
        with:
          name: DS-Study-Lab-linux
          # latest-linux.yml lets the AppImage find and download updates
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/latest-linux.yml
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-linux
          path: smoke-out

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: DS-Study-Lab-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/latest-linux.yml
          generate_release_notes: true
